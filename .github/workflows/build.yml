name: Build Verification

on:
  push:
    branches:
      - develop
      - add-files
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Build (Windows / .NET Framework 4.8)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore gta.sln

      - name: Download pinned ScriptHookVDotNet Enhanced dependency
        shell: powershell
        run: |
          $dest = "${{ runner.temp }}\shvdn-enhanced"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $zipPath = Join-Path $dest "ScriptHookVDotNetEnhanced-v1.1.0.6.zip"
          $downloadUrl = "https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip"
          $expectedSha256 = "f10da8819fa6814fb0a04553567d2516934eac96b16af06ad8f315f0da00473a"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath -UseBasicParsing

          $actualSha256 = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "ScriptHookVDotNet Enhanced archive checksum mismatch. Expected $expectedSha256, got $actualSha256."
          }

          $extractPath = Join-Path $dest "extracted"
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $dll = Get-ChildItem -Path $extractPath -Filter "ScriptHookVDotNet3.dll" -File -Recurse | Select-Object -First 1
          if ($null -eq $dll) {
            throw "ScriptHookVDotNet3.dll was not found in ScriptHookVDotNet Enhanced v1.1.0.6 archive."
          }

          echo "SHVDN_PATH=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Build Debug configuration
        run: msbuild gta.csproj /p:Configuration=Debug /p:Platform="AnyCPU" /p:ScriptHookVDotNetPath="${{ env.SHVDN_PATH }}"

      - name: Build Release configuration
        run: msbuild gta.csproj /p:Configuration=Release /p:Platform="AnyCPU" /p:ScriptHookVDotNetPath="${{ env.SHVDN_PATH }}"
