name: Build Verification

on:
  push:
    branches:
      - develop
      - add-files
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    name: Build (Windows / .NET Framework 4.8)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore gta.sln

      - name: Download ScriptHookVDotNet Enhanced dependency
        shell: powershell
        run: |
          $dest = "${{ runner.temp }}\shvdn"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zipPath = Join-Path $dest "ScriptHookVDotNet.zip"
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/scripthookvdotnet/scripthookvdotnet-nightly/releases/latest" -Headers @{ "User-Agent" = "CI-Build" }
            $downloadUrl = $release.assets[0].browser_download_url
            Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath -UseBasicParsing
          } catch {
            Invoke-WebRequest -Uri "https://github.com/scripthookvdotnet/scripthookvdotnet-nightly/releases/download/v3.7.0-nightly.189/ScriptHookVDotNet-v3.7.0-nightly.189.zip" -OutFile $zipPath -UseBasicParsing
          }
          Expand-Archive -Path $zipPath -DestinationPath $dest -Force
          $dllPath = Join-Path $dest "ScriptHookVDotNet3.dll"
          if (-not (Test-Path $dllPath)) {
            throw "ScriptHookVDotNet3.dll was not found in downloaded archive."
          }
          echo "SHVDN_PATH=$dllPath" >> $env:GITHUB_ENV

      - name: Build Debug configuration
        run: msbuild gta.csproj /p:Configuration=Debug /p:Platform="AnyCPU" /p:ScriptHookVDotNetPath="${{ env.SHVDN_PATH }}"

      - name: Build Release configuration
        run: msbuild gta.csproj /p:Configuration=Release /p:Platform="AnyCPU" /p:ScriptHookVDotNetPath="${{ env.SHVDN_PATH }}"
